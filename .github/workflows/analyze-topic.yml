name: Analyze a topic

# Runs the Claude research agent on one topic, saves the report to
# frontend/public/data/analyses/, commits it, and redeploys the site.
# Needs the ANTHROPIC_API_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to analyze, e.g. tomography reconstruction"
        required: true
        type: string

# Separate group from the deploy workflow it calls, so the two don't wait on each other.
concurrency:
  group: analyze-topic
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pipeline/requirements.txt
      - run: pip install -r backend/pipeline/requirements.txt
      - name: Run research agent
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: python -m pipeline.analyze_topic "$TOPIC"
      - name: Commit report
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/analyses
          git commit -m "Add analysis: $TOPIC"
          git pull --rebase
          git push

  deploy:
    needs: analyze
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
      pages: write
      id-token: write
