name: Refresh data and deploy site

# Builds the static site in frontend/ and publishes it to GitHub Pages.
# On the daily schedule (or a manual run with "Refresh data" ticked) it first
# fetches new papers and news, scores them, and commits the updated JSON.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # daily, 11:00 UTC
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Fetch new papers and news before deploying"
        type: boolean
        default: true
  workflow_call:
    inputs:
      refresh_data:
        type: boolean
        default: false

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  refresh-data:
    if: github.event_name == 'schedule' || inputs.refresh_data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pipeline/requirements.txt
      - run: pip install -r backend/pipeline/requirements.txt
      - name: Fetch, score and export
        working-directory: backend
        env:
          # Optional. Without it, papers are fetched but left unscored.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.update_data
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh site data"
          git pull --rebase
          git push

  deploy:
    needs: refresh-data
    if: ${{ !cancelled() && (needs.refresh-data.result == 'success' || needs.refresh-data.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
